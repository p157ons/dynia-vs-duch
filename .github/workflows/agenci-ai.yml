name: Agenci AI – analiza danych

on:
  workflow_dispatch:
    inputs:
      pytanie:
        description: "Pytanie do agentów"
        required: true
        default: "Przeanalizuj sprzedaż: trendy miesięczne, najlepsze produkty i regiony."

jobs:
  analiza:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agenci-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - name: Uruchom agentów
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTANIE: ${{ inputs.pytanie }}
        run: python -m agenci "$PYTANIE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wyniki-analizy
          path: agenci-ai/wyniki/
          if-no-files-found: ignore
